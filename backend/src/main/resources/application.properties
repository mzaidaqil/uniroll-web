spring.application.name=uniroll-web

# Cloud Run sets PORT; locally it's 8080
server.port=${PORT:8080}

# Database: values after ":" are local defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uniroll}
spring.datasource.username=${DB_USERNAME:uniroll}
spring.datasource.password=${DB_PASSWORD:uniroll}

# Flyway creates the tables; Hibernate only checks the Java classes match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health