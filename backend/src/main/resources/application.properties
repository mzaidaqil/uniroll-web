spring.application.name=uniroll-web

# Cloud Run sets PORT; locally it's 8080
server.port=${PORT:8080}

# Database: values after ":" are local defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uniroll}
spring.datasource.username=${DB_USERNAME:uniroll}
spring.datasource.password=${DB_PASSWORD:uniroll}

# Flyway creates the tables; Hibernate only checks the Java classes match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# JWT signing key: HS256 needs at least 32 bytes. The default is for local dev only;
# production sets JWT_SECRET from a secret store
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
app.jwt.expiry=${JWT_EXPIRY:1h}